name: Submodule pointer
# Parent repo (asimwe1/forge) tracks forge-backend, forge-landing, forge-mobile submodule SHAs.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
jobs:
  check:
    name: Verify forge submodule
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}
      - name: Confirm forge-mobile checkout
        run: |
          test -f forge-mobile/package.json
          test -f forge-mobile/app.json
          echo "forge-mobile SHA: $(git -C forge-mobile rev-parse --short HEAD)"
          echo "forge-mobile version: $(node -p "require('./forge-mobile/package.json').version")"
